name: ibanking-tuition

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:-tdtu-soa-midterm-jwt-secret}
  JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-60}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-tdtu-soa-internal-token}
  OTP_PEPPER: ${OTP_PEPPER:-tdtu-soa-otp-pepper}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  LOCK_HOLD_MS: ${LOCK_HOLD_MS:-150}
  AUTH_SERVICE_URL: http://auth-service:8000
  ACCOUNT_SERVICE_URL: http://account-service:8000
  TUITION_SERVICE_URL: http://tuition-service:8000
  PAYMENT_SERVICE_URL: http://payment-service:8000
  OTP_SERVICE_URL: http://otp-service:8000
  NOTIFICATION_SERVICE_URL: http://notification-service:8000
  SMTP_HOST: ${SMTP_HOST:-mailhog}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@ibanking.tdtu.edu.vn}

x-service: &service
  restart: unless-stopped
  networks: [ibanking]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: ibanking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibanking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibanking}
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibanking} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [ibanking]

  # Bắt toàn bộ email OTP/biên lai, xem tại http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ibanking-mailhog
    ports: ["1025:1025", "8025:8025"]
    networks: [ibanking]
    restart: unless-stopped

  auth-service:
    <<: *service
    build: {context: ./services, args: {SERVICE: auth-service}}
    container_name: ibanking-auth
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ibanking}:${POSTGRES_PASSWORD:-ibanking}@postgres:5432/authdb
    ports: ["8001:8000"]

  account-service:
    <<: *service
    build: {context: ./services, args: {SERVICE: account-service}}
    container_name: ibanking-account
    environment:
      <<: *common-env
      SERVICE_NAME: account-service
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ibanking}:${POSTGRES_PASSWORD:-ibanking}@postgres:5432/accountdb
    ports: ["8002:8000"]

  tuition-service:
    <<: *service
    build: {context: ./services, args: {SERVICE: tuition-service}}
    container_name: ibanking-tuition-svc
    environment:
      <<: *common-env
      SERVICE_NAME: tuition-service
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ibanking}:${POSTGRES_PASSWORD:-ibanking}@postgres:5432/tuitiondb
    ports: ["8003:8000"]

  notification-service:
    <<: *service
    build: {context: ./services, args: {SERVICE: notification-service}}
    container_name: ibanking-notification
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ibanking}:${POSTGRES_PASSWORD:-ibanking}@postgres:5432/notificationdb
    ports: ["8006:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mailhog: {condition: service_started}

  otp-service:
    <<: *service
    build: {context: ./services, args: {SERVICE: otp-service}}
    container_name: ibanking-otp
    environment:
      <<: *common-env
      SERVICE_NAME: otp-service
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ibanking}:${POSTGRES_PASSWORD:-ibanking}@postgres:5432/otpdb
    ports: ["8005:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      notification-service: {condition: service_healthy}

  payment-service:
    <<: *service
    build: {context: ./services, args: {SERVICE: payment-service}}
    container_name: ibanking-payment
    environment:
      <<: *common-env
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ibanking}:${POSTGRES_PASSWORD:-ibanking}@postgres:5432/paymentdb
    ports: ["8004:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      account-service: {condition: service_healthy}
      tuition-service: {condition: service_healthy}
      otp-service: {condition: service_healthy}

  api-gateway:
    build: {context: ./services, args: {SERVICE: api-gateway}}
    container_name: ibanking-gateway
    restart: unless-stopped
    networks: [ibanking]
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
    ports: ["8080:8000"]
    depends_on:
      auth-service: {condition: service_healthy}
      account-service: {condition: service_healthy}
      tuition-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}

  web:
    image: nginx:1.27-alpine
    container_name: ibanking-web
    restart: unless-stopped
    networks: [ibanking]
    ports: ["3000:80"]
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway: {condition: service_started}

networks:
  ibanking:
    driver: bridge

volumes:
  pgdata:
